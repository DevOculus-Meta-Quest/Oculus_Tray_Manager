name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore OculusTrayTool.sln

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild OculusTrayTool.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path bin\Release\* -DestinationPath OculusTrayTool.zip -Force

    - name: Setup Inno Setup
      run: choco install innosetup

    - name: Compile Installer
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build-Artifacts
        path: |
          OculusTrayTool.zip
          OculusTrayTool_Setup.exe
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OculusTrayTool.zip
          OculusTrayTool_Setup.exe
        draft: true
        generate_release_notes: true
